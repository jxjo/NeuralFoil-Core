[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralfoil-core"
version = "0.1.0"
description = "Minimal NeuralFoil runtime/core fork with reduced dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Peter Sharpe" },
    { name = "NeuralFoil-Core contributors" }
]
keywords = [
    "aerodynamics",
    "airfoil",
    "neuralfoil",
    "numpy",
    "runtime",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["neuralfoil"]

[tool.hatch.build.targets.sdist]
include = [
    "/neuralfoil",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE.txt",
]
